<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Meridian</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0712; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #stage { position: relative; }
  #scene, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { cursor: crosshair; touch-action: none; }
  #overlay { pointer-events: none; }
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="Vice Meridian, an open-world crime game. WASD to walk and drive, shift to run, E to take or leave a car, the left mouse button to shoot, R to reload."></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
